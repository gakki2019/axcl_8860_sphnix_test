<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d6dee9; stroke-width: 1.6; rx: 16; }
      .hostPanel { fill: #f5f9ff; stroke: #9cc5ef; }
      .devPanel { fill: #f5fbf6; stroke: #9bd2a6; }
      .apiBox { fill: #eef4ff; stroke: #5b7fc7; stroke-width: 1.7; rx: 14; }
      .hostBox { fill: #edf6ff; stroke: #6aa9e9; stroke-width: 1.6; rx: 10; }
      .devBox { fill: #edf9f0; stroke: #66bd7a; stroke-width: 1.6; rx: 10; }
      .title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 21px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #64748b; }
      .label { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 17px; font-weight: 700; fill: #263445; }
      .small { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #64748b; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #334155; }
      .codeBold { font-family: Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; fill: #334155; }
      .apiTitle { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 700; fill: #285f9f; }
      .bad { stroke: #d76a63; stroke-width: 2.1; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
      .badStop { stroke: #d76a63; stroke-width: 3; stroke-linecap: round; }
      .h2d { stroke: #2f6fb5; stroke-width: 2.4; fill: none; marker-end: url(#arrowBlue); }
      .d2h { stroke: #3f9560; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
      .divider { stroke: #c8d2df; stroke-width: 1.3; stroke-dasharray: 6 7; }
      .badText { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 700; fill: #b94a45; }
      .goodText { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: 700; fill: #285f9f; text-anchor: middle; }
    </style>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d76a63"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fb5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f9560"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="350"/>

  <!-- HOST / DEVICE panels -->
  <rect class="panel hostPanel" x="38" y="42" width="340" height="285"/>
  <rect class="panel devPanel" x="602" y="42" width="340" height="285"/>
  <line class="divider" x1="490" y1="58" x2="490" y2="320"/>

  <text class="title" x="68" y="80">HOST</text>
  <text class="subtitle" x="68" y="104">应用运行在 Host 侧</text>

  <text class="title" x="632" y="80">DEVICE</text>
  <text class="subtitle" x="632" y="104">设备内存位于 Device 侧</text>

  <!-- Memory boxes -->
  <rect class="hostBox" x="78" y="155" width="260" height="108"/>
  <text class="label" x="105" y="188">Host Memory</text>
  <text class="code" x="105" y="216">axclrtMallocHost | malloc</text>
  <text class="small" x="105" y="241">Host 应用可直接读写</text>

  <rect class="devBox" x="642" y="155" width="260" height="108"/>
  <text class="label" x="669" y="188">Device Memory</text>
  <text class="code" x="669" y="216">devPtr 传给 AXCL API</text>
  <text class="small" x="669" y="241">Host 不能直接解引用访问</text>

  <!-- Direct access: forbidden, straight line above boxes -->
  <path class="bad" d="M 338 124 L 642 124"/>
  <line class="badStop" x1="480" y1="114" x2="500" y2="134"/>
  <line class="badStop" x1="500" y1="114" x2="480" y2="134"/>
  <text class="badText" x="375" y="102">直接读写 Device Memory 不可行</text>

  <!-- AXCL API box in the middle -->
  <rect class="apiBox" x="398" y="170" width="184" height="84"/>
  <text class="apiTitle" x="423" y="195">AXCL Memory API</text>
  <text class="codeBold" x="420" y="222">axclrtMemcpy</text>
  <text class="codeBold" x="420" y="244">axclrtMemcpyAsync</text>

  <!-- H2D and D2H paths: straight, parallel, no crossing -->
  <path class="h2d" d="M 338 196 L 398 196"/>
  <path class="h2d" d="M 582 196 L 642 196"/>
  <text class="goodText" x="490" y="157">H → D</text>

  <path class="d2h" d="M 642 235 L 582 235"/>
  <path class="d2h" d="M 398 235 L 338 235"/>
  <text class="goodText" x="490" y="278">D → H</text>
</svg>
