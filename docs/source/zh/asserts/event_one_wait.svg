<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">一个任务等待一个事件示意图</title>
  <desc id="desc">Device 内有 stream1 和 stream2 两条任务序列。stream1 中 task1 后插入 Event Record，stream2 中插入 Event Wait。Event Record 完成后，Event Wait 放行后续 task2。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#565656" /></marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#777" /></marker>
    <style>
      .device { fill:#f5f6f8; stroke:#b9bec7; stroke-width:1.5; rx:10; }
      .title { font:18px sans-serif; fill:#333; text-anchor:middle; dominant-baseline:middle; }
      .lane-label { font:14px sans-serif; fill:#222; text-anchor:end; dominant-baseline:middle; }
      .task { fill:#c8dcff; stroke:#c8dcff; stroke-width:1; rx:4; }
      .record { fill:#28bdb3; stroke:#28bdb3; stroke-width:1; rx:4; }
      .wait { fill:#5a78f0; stroke:#5a78f0; stroke-width:1; rx:4; }
      .node-text { font:16px sans-serif; fill:#111; text-anchor:middle; dominant-baseline:middle; }
      .white-text { font:16px sans-serif; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
      .small { font:13px sans-serif; fill:#333; text-anchor:middle; dominant-baseline:middle; }
      .line { stroke:#565656; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#777; stroke-width:1.5; stroke-dasharray:8 7; fill:none; marker-end:url(#arrow-dash); }
    </style>
  </defs>
  <rect class="device" x="20" y="16" width="860" height="236" />
  <text class="title" x="450" y="42">Device</text>
  <text class="lane-label" x="98" y="104">stream1</text><text class="lane-label" x="98" y="124">任务序列</text>
  <text class="lane-label" x="98" y="202">stream2</text><text class="lane-label" x="98" y="222">任务序列</text>
  <path class="line" d="M112,114 L840,114" />
  <path class="line" d="M112,212 L840,212" />
  <rect class="task" x="170" y="89" width="150" height="50" /><text class="node-text" x="245" y="114">task1</text>
  <rect class="record" x="390" y="89" width="170" height="50" /><text class="white-text" x="475" y="114">Event Record</text>
  <rect class="wait" x="390" y="187" width="170" height="50" /><text class="white-text" x="475" y="212">Event Wait</text>
  <rect class="task" x="650" y="187" width="150" height="50" /><text class="node-text" x="725" y="212">task2</text>
  <text class="small" x="562" y="72">task1 完成事件</text>
  <path class="dash" d="M475,139 L475,187" />
  <text class="small" x="610" y="165">等到事件后执行后续任务</text>
</svg>
